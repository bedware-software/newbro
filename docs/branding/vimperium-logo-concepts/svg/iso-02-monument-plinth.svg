<rect x="7" y="49.5" width="54" height="1.5" fill="url(#under)"/>
<polygon points="55,53 61,49 61,53 55,57" fill="color-mix(in oklch, var(--c2, #bb9af7) 30%, var(--bg, #1a1a1a))"/>
