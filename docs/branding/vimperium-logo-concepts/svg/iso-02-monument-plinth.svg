<rect x="7" y="53" width="48" height="1.5" fill="color-mix(in oklch, var(--c1, #7aa2f7) 40%, var(--fg, #e0e0e0))" opacity=".5"/>
<g filter="url(#glow)" opacity=".9"><rect x="17" y="56.2" width="6" height="1.5" fill="var(--c3, #7dcfff)"/><rect x="29" y="56.2" width="6" height="1.5" fill="var(--hot, #ff5fb0)"/><rect x="41" y="56.2" width="6" height="1.5" fill="var(--c3, #7dcfff)"/></g>
<rect x="17" y="56.2" width="6" height="1.5" fill="var(--c3, #7dcfff)"/><rect x="29" y="56.2" width="6" height="1.5" fill="var(--hot, #ff5fb0)"/><rect x="41" y="56.2" width="6" height="1.5" fill="var(--c3, #7dcfff)"/>
