<polygon points="23,11 31,27 37,23 29,7" fill="color-mix(in oklch, var(--c1, #7aa2f7) 40%, var(--bg, #1a1a1a))"/>
<polygon points="9,11 23,11 29,7 15,7" fill="url(#top)"/>
<polygon points="39,11 53,11 59,7 45,7" fill="url(#top)"/>
<polygon points="53,11 31,53 37,49 59,7" fill="url(#side)"/>
<path d="M9 11L23 11L31 27L39 11L53 11L31 53Z" fill="url(#front)"/>
<path d="M9.75 11L31.75 53M52.25 11L30.25 53" fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.5" opacity=".5"/>
<path d="M22.25 11L30.25 27L39.75 11" fill="none" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 30%, var(--bg, #1a1a1a))" stroke-width="1.5" opacity=".7"/>
<g filter="url(#glow)" opacity=".8"><rect x="9" y="11" width="14" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 55%, var(--fg, #e0e0e0))"/><rect x="39" y="11" width="14" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 55%, var(--fg, #e0e0e0))"/></g>
<rect x="9" y="11" width="14" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 55%, var(--fg, #e0e0e0))"/><rect x="39" y="11" width="14" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 55%, var(--fg, #e0e0e0))"/>
<!-- hot beacon at the top of the right arm -->
<rect x="48" y="8" width="2" height="2" fill="var(--hot, #ff5fb0)"/>
<rect x="31.5" y="12.5" width="4" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 70%, var(--fg, #e0e0e0))" opacity=".9"/>
