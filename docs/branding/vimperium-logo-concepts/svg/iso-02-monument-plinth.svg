<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="53">
<stop offset="0" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 62%, var(--bg, #1a1a1a))"/><stop offset=".7" stop-color="var(--c1, #7aa2f7)"/><stop offset="1" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 80%, var(--fg, #e0e0e0))"/>
</linearGradient>
<linearGradient id="side" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="53">
<stop offset="0" stop-color="color-mix(in oklch, var(--c2, #bb9af7) 55%, var(--bg, #1a1a1a))"/><stop offset="1" stop-color="var(--c2, #bb9af7)"/>
</linearGradient>
<linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="7">
<stop offset="0" stop-color="var(--c3, #7dcfff)"/><stop offset="1" stop-color="color-mix(in oklch, var(--c3, #7dcfff) 60%, var(--bg, #1a1a1a))"/>
</linearGradient>
<linearGradient id="refl" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="60" y2="0">
<stop offset="0" stop-color="var(--c3, #7dcfff)" stop-opacity="0"/><stop offset=".5" stop-color="var(--c3, #7dcfff)"/><stop offset="1" stop-color="var(--c3, #7dcfff)" stop-opacity="0"/>
</linearGradient>
<radialGradient id="under" gradientUnits="userSpaceOnUse" cx="31" cy="53" r="20">
<stop offset="0" stop-color="var(--c3, #7dcfff)" stop-opacity=".55"/><stop offset="1" stop-color="var(--c3, #7dcfff)" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<!-- HUD altitude ruler -->
<g fill="var(--c3, #7dcfff)" opacity=".6"><rect x="1" y="10" width="2" height="1.5"/><rect x="1" y="14" width="4" height="1.5"/><rect x="1" y="18" width="2" height="1.5"/><rect x="1" y="22" width="2" height="1.5"/><rect x="1" y="26" width="4" height="1.5"/><rect x="1" y="30" width="2" height="1.5"/><rect x="1" y="34" width="2" height="1.5"/><rect x="1" y="38" width="4" height="1.5"/><rect x="1" y="42" width="2" height="1.5"/><rect x="1" y="46" width="2" height="1.5"/><rect x="1" y="50" width="4" height="1.5"/></g>
<!-- plinth -->
