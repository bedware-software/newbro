<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wash" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="var(--c1, #7aa2f7)" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="var(--c2, #bb9af7)" stop-opacity="0.1"/>
      <stop offset="1" stop-color="var(--c2, #bb9af7)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7dcfff)"/>
      <stop offset="1" stop-color="var(--c1, #7aa2f7)"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7aa2f7)"/>
      <stop offset="1" stop-color="var(--c2, #bb9af7)"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="26.5"/></clipPath>
    <path id="v" d="M12 17L15 14H21L32 38.1L43 14H49L52 17L36.5 48H27.5Z"/>
    <path id="al" d="M12 17L15 14H21L36.5 48H27.5Z"/>
    <path id="ar" d="M43 14H49L52 17L36.5 48H27.5Z"/>
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <circle cx="32" cy="32" r="27" fill="url(#wash)"/>
  <!-- faint secondary ring, two segments -->
  <g fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1" opacity="0.5">
    <path d="M10.5 10.5A30.5 30.5 0 0 1 32 1.5"/>
    <path d="M62.5 32A30.5 30.5 0 0 1 53.5 53.5"/>
  </g>
  <!-- broken outer ring: four arcs, gaps on the diagonals -->
  <g fill="none" stroke="var(--c1, #7aa2f7)" stroke-width="3">
    <path d="M54.94 15.94A28 28 0 0 1 54.94 48.06"/>
    <path d="M48.06 54.94A28 28 0 0 1 15.94 54.94"/>
    <path d="M9.06 48.06A28 28 0 0 1 9.06 15.94"/>
    <path d="M15.94 9.06A28 28 0 0 1 48.06 9.06"/>
  </g>
  <g fill="none" stroke="var(--c2, #bb9af7)" stroke-width="1.6">
    <path d="M50.4 13.6L53.2 10.8M13.6 13.6L10.8 10.8M50.4 50.4L53.2 53.2M13.6 50.4L10.8 53.2"/>
  </g>
  <!-- inner tick ring + crosshair ticks -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.6" stroke-dasharray="1.6 4.4" opacity="0.75"/>
  <g fill="none" stroke="var(--c3, #7dcfff)" stroke-width="2.2" stroke-linecap="square">
    <path d="M32 6.5V11.5M6.5 32H11.5M52.5 32H57.5"/>
  </g>
  <!-- glow (filter) + plain halo for the no-filter case -->
  <use href="#v" fill="var(--c1, #7aa2f7)" opacity="0.6" filter="url(#f)"/>
  <use href="#v" fill="none" stroke="var(--c1, #7aa2f7)" stroke-width="3" opacity="0.2"/>
  <!-- two ribbons: right arm folds over the left at the apex -->
  <use href="#al" fill="url(#ga)"/>
  <use href="#al" fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.1" opacity="0.7"/>
  <use href="#ar" fill="url(#gb)"/>
  <path d="M27.5 48L36.5 48L43 33.7L35.8 29.8Z" fill="var(--bg, #1a1a1a)" opacity="0.18"/>
  <use href="#ar" fill="none" stroke="var(--c2, #bb9af7)" stroke-width="1.1" opacity="0.9"/>
  <!-- bevel highlights along the outer edges -->
  <g fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.5" stroke-linecap="round">
    <path d="M15.2 19.5L26 43.5" opacity="0.9"/>
    <path d="M48.8 19.5L38 43.5" opacity="0.55"/>
  </g>
  <!-- stencil cut across the right arm -->
  <rect x="-7" y="-0.95" width="14" height="1.9" transform="translate(44.6 22.6) rotate(24.5)" fill="var(--bg, #1a1a1a)" opacity="0.92"/>
  <!-- scanline band crossing the V -->
  <g clip-path="url(#disc)">
    <rect x="4" y="27" width="56" height="5" fill="color-mix(in oklch, var(--c3, #7dcfff) 40%, transparent)"/>
    <rect x="4" y="27" width="56" height="1" fill="var(--c3, #7dcfff)" opacity="0.7"/>
  </g>
  <!-- readout bar -->
  <g>
    <rect x="19.5" y="52.5" width="4" height="2.6" fill="var(--c3, #7dcfff)"/>
    <rect x="24.5" y="52.5" width="4" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.8"/>
    <rect x="29.5" y="52.5" width="4" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.6"/>
    <rect x="34.5" y="52.5" width="4" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.4"/>
    <rect x="39.5" y="52.5" width="4" height="2.6" fill="var(--hot, #ff5fb0)"/>
  </g>
</svg>
