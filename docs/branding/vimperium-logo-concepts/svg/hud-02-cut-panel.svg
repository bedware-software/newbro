<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--c1, #7aa2f7)" stop-opacity="0.2"/>
      <stop offset="1" stop-color="var(--c3, #7dcfff)" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7dcfff)"/>
      <stop offset="1" stop-color="var(--c1, #7aa2f7)"/>
    </linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7dcfff)"/>
      <stop offset="1" stop-color="var(--c3, #7dcfff)" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--c1, #7aa2f7)" stop-opacity="0.45"/>
      <stop offset="1" stop-color="var(--c1, #7aa2f7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="var(--c1, #7aa2f7)" opacity="0.1"/>
    </pattern>
    <path id="plate" d="M2 9L9 2H42L45 5H53L62 14V55L55 62H12L2 52Z"/>
    <clipPath id="pc"><use href="#plate"/></clipPath>
    <path id="v" d="M9 14H18L27 35L36 14H45L30 49H24Z"/>
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <!-- the panel: bg plate + tinted gradient + scanline texture + glow -->
  <use href="#plate" fill="var(--bg, #1a1a1a)"/>
  <g clip-path="url(#pc)">
    <rect width="64" height="64" fill="url(#pl)"/>
    <rect width="64" height="64" fill="url(#scan)"/>
    <ellipse cx="27" cy="34" rx="26" ry="22" fill="url(#glow)"/>
    <!-- header band -->
    <path d="M4 10L8 4H40L42.5 7.5L40 10Z" fill="var(--c1, #7aa2f7)" opacity="0.45"/>
    <!-- scanline band -->
    <rect x="0" y="25" width="64" height="5" fill="color-mix(in oklch, var(--c3, #7dcfff) 40%, transparent)"/>
    <rect x="0" y="25" width="64" height="0.9" fill="var(--c3, #7dcfff)" opacity="0.65"/>
  </g>
  <use href="#plate" fill="none" stroke="var(--c1, #7aa2f7)" stroke-width="2" stroke-linejoin="miter"/>
  <!-- inner double outline, chamfered steps -->
  <path d="M5.5 10.5L10.5 5.5H41L43.5 8H53.5L58.5 13V36" fill="none" stroke="var(--c1, #7aa2f7)" stroke-width="1" opacity="0.45"/>
  <path d="M58.5 44V53.5L53.5 58.5H14L5.5 50V40" fill="none" stroke="var(--c1, #7aa2f7)" stroke-width="1" opacity="0.45"/>
  <!-- header lights -->
  <rect x="28" y="6" width="2.4" height="2.4" fill="var(--c3, #7dcfff)" opacity="0.9"/>
  <rect x="32" y="6" width="2.4" height="2.4" fill="var(--c3, #7dcfff)" opacity="0.55"/>
  <circle cx="38.2" cy="7.2" r="1.4" fill="var(--hot, #ff5fb0)"/>
  <!-- right rail ticks -->
  <g fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.5" opacity="0.8">
    <path d="M56 20H60M57.5 24H60M57.5 28H60M56 32H60M57.5 36H60"/>
  </g>
  <!-- the V: glow, halo, gradient body, shade facet, violet edge, bevel -->
  <use href="#v" fill="var(--c1, #7aa2f7)" opacity="0.6" filter="url(#f)"/>
  <use href="#v" fill="none" stroke="var(--c1, #7aa2f7)" stroke-width="3" opacity="0.2"/>
  <use href="#v" fill="url(#vg)"/>
  <path d="M18 14H26L30 49H24Z" fill="var(--bg, #1a1a1a)" opacity="0.12"/>
  <use href="#v" fill="none" stroke="var(--c2, #bb9af7)" stroke-width="1.1" opacity="0.9"/>
  <g fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.5" stroke-linecap="round">
    <path d="M11.5 17.5L24.5 46" opacity="0.9"/>
    <path d="M42.5 17.5L29.5 46" opacity="0.5"/>
  </g>
  <!-- stencil cut across the left arm -->
  <rect x="-7" y="-0.95" width="14" height="1.9" transform="translate(16.2 24.2) rotate(-23.2)" fill="var(--bg, #1a1a1a)" opacity="0.92"/>
  <!-- block cursor after the V -->
  <rect x="48" y="37" width="8" height="12" fill="var(--c3, #7dcfff)" opacity="0.5" filter="url(#f)"/>
  <rect x="48" y="37" width="8" height="12" fill="url(#cg)"/>
  <rect x="48" y="37" width="8" height="1.6" fill="var(--hot, #ff5fb0)"/>
  <!-- readout bars -->
  <g>
    <rect x="9" y="53" width="6" height="2.6" fill="var(--c3, #7dcfff)"/>
    <rect x="16.5" y="53" width="6" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.8"/>
    <rect x="24" y="53" width="6" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.6"/>
    <rect x="31.5" y="53" width="6" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.4"/>
    <rect x="39" y="53" width="6" height="2.6" fill="var(--c3, #7dcfff)" opacity="0.25"/>
    <rect x="48" y="53" width="8" height="2.6" fill="var(--hot, #ff5fb0)"/>
    <rect x="13" y="57.5" width="18" height="1.4" fill="var(--c1, #7aa2f7)" opacity="0.7"/>
    <rect x="33" y="57.5" width="9" height="1.4" fill="var(--c1, #7aa2f7)" opacity="0.35"/>
    <rect x="44" y="57.5" width="4" height="1.4" fill="var(--c2, #bb9af7)" opacity="0.7"/>
  </g>
</svg>
