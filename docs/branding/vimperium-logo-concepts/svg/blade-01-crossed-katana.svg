    <stop offset="1" stop-color="var(--c1, #7aa2f7)" stop-opacity="0"/>
  </radialGradient>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
  <g id="sw">
    <polygon points="-5,1.6 -3.3,39.5 1.6,48 3,39.5 5,1.6" fill="url(#bl)"/>
