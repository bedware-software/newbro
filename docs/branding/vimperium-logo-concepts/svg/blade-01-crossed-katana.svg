<polygon points="10,4 54,4 61,11 61,55 54,62 10,62 3,55 3,11" fill="url(#pl)" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 50%, var(--bg, #1a1a1a))" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="11.5,6.5 52.5,6.5 58.5,12.5 58.5,53.5 52.5,59.5 11.5,59.5 5.5,53.5 5.5,12.5" fill="none" stroke="color-mix(in oklch, var(--c3, #7dcfff) 32%, var(--bg, #1a1a1a))" stroke-width="1.5" stroke-linejoin="round"/>
