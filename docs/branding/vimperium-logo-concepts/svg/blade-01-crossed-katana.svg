<rect x="10" y="30" width="44" height="34" fill="url(#wash)"/>
<!-- right sword behind -->
<g transform="matrix(-1 0 0 1 64 0) translate(15 14) rotate(-25)"><polygon points="-5,1.6 -3.3,39.5 1.6,48 3,39.5 5,1.6" fill="none" stroke="var(--bg, #1a1a1a)" stroke-width="2.4" stroke-linejoin="round"/></g>
<use href="#sw" transform="matrix(-1 0 0 1 64 0) translate(15 14) rotate(-25)"/>
<!-- left sword in front, with a dark separation outline -->
<g transform="translate(15 14) rotate(-25)"><polygon points="-5,1.6 -3.3,39.5 1.6,48 3,39.5 5,1.6" fill="var(--bg, #1a1a1a)" stroke="var(--bg, #1a1a1a)" stroke-width="2.6" stroke-linejoin="round"/></g>
<use href="#sw" transform="translate(15 14) rotate(-25)"/>
<!-- the light slash -->
<polygon points="54,20 32.81,34.38 10,46 31.19,31.62" fill="var(--hot, #ff5fb0)" opacity=".6" filter="url(#gl)"/>
<polygon points="54,20 32.81,34.38 10,46 31.19,31.62" fill="var(--hot, #ff5fb0)"/>
<polygon points="50.5,22.1 32.41,33.69 13.5,43.9 31.59,32.31" fill="var(--c3, #7dcfff)" opacity=".9"/>
<!-- spark at the crossing: the diamond -->
