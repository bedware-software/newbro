    <path d="M1 5L-0.3 36.5" stroke="var(--c2, #bb9af7)" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".45" filter="url(#gl)"/>
    <path d="M1 5L-0.3 36.5" stroke="var(--c2, #bb9af7)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M-3.3 39.5L3 39.5" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 30%, var(--bg, #1a1a1a))" stroke-width="1.5" fill="none"/>
    <g fill="var(--bg, #1a1a1a)" opacity=".8"><rect x="3" y="7" width="2.2" height="1.8"/><rect x="2.8" y="11" width="2.4" height="1.8"/><rect x="2.7" y="15" width="2.5" height="1.8"/></g>
    <polygon points="-2.7,-1.7 -2.7,-11.6 2.7,-11.6 2.7,-1.7" fill="color-mix(in oklch, var(--c2, #bb9af7) 42%, var(--bg, #1a1a1a))"/>
    <polygon points="0,-6.5 2.1,-4.6 0,-2.7 -2.1,-4.6" fill="var(--c2, #bb9af7)"/>
    <polygon points="0,-10.6 2.1,-8.7 0,-6.8 -2.1,-8.7" fill="var(--c2, #bb9af7)"/>
    <polygon points="-2.7,-11.6 -2.7,-12.8 -2,-13.6 2,-13.6 2.7,-12.8 2.7,-11.6" fill="color-mix(in oklch, var(--c2, #bb9af7) 70%, var(--bg, #1a1a1a))"/>
    <polygon points="-7.5,0 -5.8,-1.8 5.8,-1.8 7.5,0 5.8,1.8 -5.8,1.8" fill="var(--c3, #7dcfff)"/>
    <path d="M-5 0L5 0" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 35%, var(--bg, #1a1a1a))" stroke-width="1.5" fill="none"/>
