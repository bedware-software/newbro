<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bl" gradientUnits="userSpaceOnUse" x1="-4.5" y1="0" x2="4.5" y2="0">
    <stop offset="0" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 64%, var(--bg, #1a1a1a))"/>
    <stop offset=".55" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 44%, var(--bg, #1a1a1a))"/>
    <stop offset="1" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 30%, var(--bg, #1a1a1a))"/>
  </linearGradient>
  <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 20%, var(--bg, #1a1a1a))"/><stop offset="1" stop-color="color-mix(in oklch, var(--c2, #bb9af7) 11%, var(--bg, #1a1a1a))"/>
  </linearGradient>
  <radialGradient id="wash" cx=".5" cy=".5" r=".5">
