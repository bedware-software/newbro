  <polygon points="25,44.7 26.3,46 25,47.3 23.7,46"/>
  <polygon points="39.6,46.1 40.7,47.2 39.6,48.3 38.5,47.2"/>
  <polygon points="32,59 33.2,60.2 32,61.4 30.8,60.2"/>
