<polygon points="32,47.7 34.7,50.4 32,53.1 29.3,50.4" fill="var(--hot, #ff5fb0)"/>
<polygon points="32,49.1 33.3,50.4 32,51.7 30.7,50.4" fill="var(--c3, #7dcfff)"/>
