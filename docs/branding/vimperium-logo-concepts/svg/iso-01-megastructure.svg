</g>
<!-- neon lit edge where the top faces meet the front -->
<g filter="url(#glow)" opacity=".8"><rect x="3" y="15" width="18" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 55%, var(--fg, #e0e0e0))"/><rect x="37" y="15" width="18" height="1.5" fill="color-mix(in oklch, var(--c3, #7dcfff) 55%, var(--fg, #e0e0e0))"/></g>
