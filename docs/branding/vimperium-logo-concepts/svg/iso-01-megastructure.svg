<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="57">
<stop offset="0" stop-color="var(--c1, #7aa2f7)"/><stop offset="1" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 68%, var(--bg, #1a1a1a))"/>
</linearGradient>
<linearGradient id="side" gradientUnits="userSpaceOnUse" x1="55" y1="15" x2="61" y2="11">
