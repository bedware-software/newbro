<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="52">
<stop offset="0" stop-color="color-mix(in oklch, var(--c3, #7dcfff) 60%, var(--bg, #1a1a1a))"/><stop offset="1" stop-color="var(--c3, #7dcfff)"/>
</linearGradient>
<radialGradient id="core" gradientUnits="userSpaceOnUse" cx="32.8" cy="49.6" r="9">
<stop offset="0" stop-color="var(--hot, #ff5fb0)"/><stop offset="1" stop-color="var(--hot, #ff5fb0)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="topg" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="53" y2="53">
<stop offset="0" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 40%, var(--bg, #1a1a1a))"/><stop offset="1" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 26%, var(--bg, #1a1a1a))"/>
</linearGradient>
<pattern id="scan" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="1" fill="var(--fg, #e0e0e0)"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
</defs>
<!-- slab sides -->
<polygon points="49,3 53,7 61,13 57,9" fill="color-mix(in oklch, var(--c2, #bb9af7) 34%, var(--bg, #1a1a1a))"/><polygon points="53,7 53,49 61,55 61,13" fill="color-mix(in oklch, var(--c2, #bb9af7) 34%, var(--bg, #1a1a1a))"/><polygon points="53,49 49,53 57,59 61,55" fill="color-mix(in oklch, var(--c1, #7aa2f7) 16%, var(--bg, #1a1a1a))"/><polygon points="49,53 7,53 15,59 57,59" fill="color-mix(in oklch, var(--c1, #7aa2f7) 16%, var(--bg, #1a1a1a))"/>
<!-- channel floor + hot core, then the cut walls -->
<polygon points="13.8,15.6 24.8,15.6 32.8,36.6 40.8,15.6 51.8,15.6 32.8,50.6" fill="url(#floor)"/>
<polygon points="13.8,15.6 24.8,15.6 32.8,36.6 40.8,15.6 51.8,15.6 32.8,50.6" fill="url(#core)"/>
<polygon points="9,12 20,12 21.63,13.22 10.63,13.22" fill="color-mix(in oklch, var(--c1, #7aa2f7) 70%, var(--bg, #1a1a1a))"/><polygon points="10.63,13.22 21.63,13.22 23.22,14.41 12.22,14.41" fill="color-mix(in oklch, var(--c2, #bb9af7) 62%, var(--bg, #1a1a1a))"/><polygon points="12.22,14.41 23.22,14.41 24.8,15.6 13.8,15.6" fill="color-mix(in oklch, var(--c1, #7aa2f7) 18%, var(--bg, #1a1a1a))"/><polygon points="28,33 36,12 37.63,13.22 29.63,34.22" fill="color-mix(in oklch, var(--c1, #7aa2f7) 70%, var(--bg, #1a1a1a))"/><polygon points="29.63,34.22 37.63,13.22 39.22,14.41 31.22,35.41" fill="color-mix(in oklch, var(--c2, #bb9af7) 62%, var(--bg, #1a1a1a))"/><polygon points="31.22,35.41 39.22,14.41 40.8,15.6 32.8,36.6" fill="color-mix(in oklch, var(--c1, #7aa2f7) 18%, var(--bg, #1a1a1a))"/><polygon points="36,12 47,12 48.63,13.22 37.63,13.22" fill="color-mix(in oklch, var(--c1, #7aa2f7) 70%, var(--bg, #1a1a1a))"/><polygon points="37.63,13.22 48.63,13.22 50.22,14.41 39.22,14.41" fill="color-mix(in oklch, var(--c2, #bb9af7) 62%, var(--bg, #1a1a1a))"/><polygon points="39.22,14.41 50.22,14.41 51.8,15.6 40.8,15.6" fill="color-mix(in oklch, var(--c1, #7aa2f7) 18%, var(--bg, #1a1a1a))"/><polygon points="28,47 9,12 10.63,13.22 29.63,48.22" fill="color-mix(in oklch, var(--c1, #7aa2f7) 70%, var(--bg, #1a1a1a))"/><polygon points="29.63,48.22 10.63,13.22 12.22,14.41 31.22,49.41" fill="color-mix(in oklch, var(--c2, #bb9af7) 62%, var(--bg, #1a1a1a))"/><polygon points="31.22,49.41 12.22,14.41 13.8,15.6 32.8,50.6" fill="color-mix(in oklch, var(--c1, #7aa2f7) 18%, var(--bg, #1a1a1a))"/>
<!-- the slab top with the V knocked out, scanlines over it -->
<path d="M7 3L49 3L53 7L53 49L49 53L7 53L3 49L3 7ZM9 12L20 12L28 33L36 12L47 12L28 47Z" fill-rule="evenodd" fill="url(#topg)"/>
<path d="M7 3L49 3L53 7L53 49L49 53L7 53L3 49L3 7ZM9 12L20 12L28 33L36 12L47 12L28 47Z" fill-rule="evenodd" fill="url(#scan)" opacity=".09"/>
<!-- glow leaking out of the channel -->
<path d="M9 12L20 12L28 33L36 12L47 12L28 47Z" fill="none" stroke="var(--c3, #7dcfff)" stroke-width="2" opacity=".55" filter="url(#glow)"/>
<!-- lit rim of the slab + corner pads -->
<path d="M7 3L49 3L53 7L53 49L49 53L7 53L3 49L3 7Z" fill="none" stroke="var(--c3, #7dcfff)" stroke-width="1.5" opacity=".35"/>
<g fill="var(--c3, #7dcfff)" opacity=".8"><rect x="5" y="5" width="2" height="2"/><rect x="49" y="49" width="2" height="2"/></g>
<g fill="var(--c3, #7dcfff)"><rect x="9" y="57" width="2" height="2"/><rect x="13" y="57" width="2" height="2"/><rect x="17" y="57" width="2" height="2" fill="var(--hot, #ff5fb0)"/></g>
</svg>
