<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 18%, var(--bg, #1a1a1a))"/>
      <stop offset="1" stop-color="color-mix(in oklch, var(--c2, #bb9af7) 10%, var(--bg, #1a1a1a))"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.45" cy="0.55" r="0.5">
      <stop offset="0" stop-color="var(--c1, #7aa2f7)" stop-opacity="0.38"/>
      <stop offset="1" stop-color="var(--c1, #7aa2f7)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7dcfff)" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="var(--c3, #7dcfff)" stop-opacity="0.65"/>
      <stop offset="1" stop-color="var(--c3, #7dcfff)" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="pc"><path d="M5 2H52L62 12V59L59 62H12L2 52V5Z"/></clipPath>
    <path id="a" d="M7 14L23 51L25 46.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="b" d="M29 38L40.2 13.8C40.7 12.6 41.6 12 43 12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="k" d="M43 12H56V52H43Z" fill="none" stroke-linejoin="round"/>
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <!-- sign cabinet: asymmetric chamfers, inner frame, readout bars -->
  <path d="M5 2H52L62 12V59L59 62H12L2 52V5Z" fill="url(#pl)" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 45%, var(--bg, #1a1a1a))" stroke-width="1.5"/>
  <g clip-path="url(#pc)">
    <rect x="2" y="2" width="60" height="60" fill="url(#wash)"/>
    <g fill="none" filter="url(#f)">
      <use href="#a" stroke="var(--c1, #7aa2f7)" stroke-width="14" opacity="0.26"/>
      <use href="#b" stroke="var(--c1, #7aa2f7)" stroke-width="14" opacity="0.26"/>
      <use href="#k" stroke="var(--c3, #7dcfff)" stroke-width="14" opacity="0.34"/>
    </g>
  </g>
  <path d="M6.5 5H50.5L59 13.5V57.5L57.5 59H13.5L5 50.5V6.5Z" fill="none" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 26%, var(--bg, #1a1a1a))" stroke-width="1.5"/>
  <path d="M52 2L62 12" stroke="var(--c1, #7aa2f7)" stroke-width="1.5" opacity="0.6"/>
  <path d="M2 52L12 62" stroke="var(--c1, #7aa2f7)" stroke-width="1.5" opacity="0.6"/>
  <g fill="color-mix(in oklch, var(--c1, #7aa2f7) 48%, var(--bg, #1a1a1a))">
    <rect x="16" y="54.5" width="9" height="1.6"/><rect x="16" y="57.5" width="5" height="1.6"/><rect x="23" y="57.5" width="7" height="1.6"/>
    <rect x="12" y="7" width="1.6" height="1.6"/><rect x="15" y="7" width="1.6" height="1.6"/><rect x="18" y="7" width="1.6" height="1.6"/>
  </g>
  <!-- sockets + feed wires: live end of the V, foot of the cursor -->
  <g fill="color-mix(in oklch, var(--c1, #7aa2f7) 50%, var(--bg, #1a1a1a))">
    <rect x="4.5" y="6" width="5" height="5" rx="0.8"/><rect x="47" y="54" width="5" height="4.5" rx="0.8"/>
  </g>
  <g stroke="color-mix(in oklch, var(--c1, #7aa2f7) 50%, var(--bg, #1a1a1a))" stroke-width="1.5">
    <path d="M7 11V15"/><path d="M49.5 51V55"/>
  </g>
  <!-- plain halos (the mark reads without the filter) -->
  <g fill="none">
    <use href="#a" stroke="var(--c1, #7aa2f7)" stroke-width="9" opacity="0.3"/>
    <use href="#b" stroke="var(--c1, #7aa2f7)" stroke-width="9" opacity="0.3"/>
    <use href="#k" stroke="var(--c3, #7dcfff)" stroke-width="9" opacity="0.36"/>
  </g>
  <!-- cursor body: the brightest thing on the sign -->
  <rect x="43" y="12" width="13" height="40" fill="url(#cur)"/>
  <!-- glass tubes: dark edge -->
  <g stroke="color-mix(in oklch, var(--c1, #7aa2f7) 35%, var(--bg, #1a1a1a))" stroke-width="6" fill="none">
    <use href="#a"/><use href="#b"/>
  </g>
  <use href="#k" stroke="color-mix(in oklch, var(--c3, #7dcfff) 35%, var(--bg, #1a1a1a))" stroke-width="6"/>
  <!-- lit cores -->
  <use href="#a" stroke="var(--c1, #7aa2f7)" stroke-width="3.8"/>
  <use href="#b" stroke="var(--c1, #7aa2f7)" stroke-width="3.8"/>
  <use href="#k" stroke="var(--c3, #7dcfff)" stroke-width="3.8"/>
  <use href="#a" stroke="var(--c3, #7dcfff)" stroke-width="1.8"/>
  <use href="#b" stroke="var(--c3, #7dcfff)" stroke-width="1.8"/>
  <!-- mounting clips -->
  <g fill="color-mix(in oklch, var(--c1, #7aa2f7) 60%, var(--bg, #1a1a1a))">
    <rect x="-1.3" y="-4.8" width="2.6" height="9.6" rx="0.8" transform="translate(14.5 31.3) rotate(66.6)"/>
    <rect x="-1.3" y="-4.8" width="2.6" height="9.6" rx="0.8" transform="translate(36 22.7) rotate(114.6)"/>
    <rect x="-1.3" y="-4.8" width="2.6" height="9.6" rx="0.8" transform="translate(56 34)"/>
    <rect x="-1.3" y="-4.8" width="2.6" height="9.6" rx="0.8" transform="translate(43 42)"/>
  </g>
  <!-- hot electrode at the break -->
  <path d="M28.2 40.4L26.2 44.6" stroke="var(--hot, #ff5fb0)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="29" cy="38" r="1.7" fill="var(--hot, #ff5fb0)"/>
  <circle cx="29" cy="38" r="3.6" fill="var(--hot, #ff5fb0)" opacity="0.3"/>
</svg>
