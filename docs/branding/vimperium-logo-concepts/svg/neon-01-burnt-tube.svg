<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="color-mix(in oklch, var(--c2, #bb9af7) 22%, var(--bg, #1a1a1a))"/>
      <stop offset="1" stop-color="color-mix(in oklch, var(--c1, #7aa2f7) 8%, var(--bg, #1a1a1a))"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.46" cy="0.56" r="0.5">
      <stop offset="0" stop-color="var(--c1, #7aa2f7)" stop-opacity="0.42"/>
      <stop offset="1" stop-color="var(--c1, #7aa2f7)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pc"><path d="M8 2H56L62 8V56L56 62H8L2 56V8Z"/></clipPath>
    <path id="a" d="M15 14L32 51L37.6 38.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="b" d="M42.2 28.8L49 14" fill="none" stroke-linecap="round"/>
    <path id="b2" d="M46.6 19.2L49 14" fill="none" stroke-linecap="round"/>
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <!-- wall plate: chamfered, bezel, scanlines, screws -->
  <path d="M8 2H56L62 8V56L56 62H8L2 56V8Z" fill="url(#pl)" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 45%, var(--bg, #1a1a1a))" stroke-width="1.5"/>
  <g clip-path="url(#pc)">
    <rect x="2" y="2" width="60" height="60" fill="url(#wash)"/>
    <g stroke="var(--c3, #7dcfff)" stroke-width="1.5" opacity="0.07">
      <path d="M2 7H62M2 11H62M2 15H62M2 19H62M2 23H62M2 27H62M2 31H62M2 35H62M2 39H62M2 43H62M2 47H62M2 51H62M2 55H62M2 59H62"/>
    </g>
  </g>
  <path d="M10 5.5H53L58.5 11V53L53 58.5H11L5.5 53V11Z" fill="none" stroke="color-mix(in oklch, var(--c1, #7aa2f7) 28%, var(--bg, #1a1a1a))" stroke-width="1.5"/>
  <g fill="color-mix(in oklch, var(--c1, #7aa2f7) 55%, var(--bg, #1a1a1a))">
    <circle cx="9.5" cy="9.5" r="1.7"/><circle cx="54.5" cy="9.5" r="1.7"/><circle cx="9.5" cy="54.5" r="1.7"/><circle cx="54.5" cy="54.5" r="1.7"/>
  </g>
  <!-- bottom rail with ticks -->
  <g stroke="color-mix(in oklch, var(--c1, #7aa2f7) 40%, var(--bg, #1a1a1a))" stroke-width="1.5" stroke-linecap="round">
    <path d="M15 56.5H49"/><path d="M19 53.5v3M25 53.5v3M31 53.5v3M37 53.5v3M43 53.5v3"/>
  </g>
  <rect x="45.5" y="52" width="4" height="4" fill="var(--c1, #7aa2f7)" opacity="0.75"/>
  <!-- sockets + feed wires -->
  <g fill="color-mix(in oklch, var(--c1, #7aa2f7) 50%, var(--bg, #1a1a1a))">
    <rect x="12.5" y="6" width="5" height="5" rx="0.8"/><rect x="46.5" y="6" width="5" height="5" rx="0.8"/>
  </g>
  <g stroke="color-mix(in oklch, var(--c1, #7aa2f7) 50%, var(--bg, #1a1a1a))" stroke-width="1.5">
    <path d="M15 11V15"/><path d="M49 11V15"/>
  </g>
  <!-- glow halos (blurred copy + plain copy so it reads without the filter) -->
  <g stroke="var(--c1, #7aa2f7)" fill="none" filter="url(#f)">
    <use href="#a" stroke-width="14" opacity="0.26"/>
    <use href="#b2" stroke-width="10" opacity="0.2"/>
  </g>
  <g stroke="var(--c1, #7aa2f7)" fill="none">
    <use href="#a" stroke-width="9" opacity="0.32"/>
    <use href="#b2" stroke-width="7.5" opacity="0.22"/>
  </g>
  <!-- glass tubes: dark edge -->
  <g stroke="color-mix(in oklch, var(--c1, #7aa2f7) 35%, var(--bg, #1a1a1a))" stroke-width="6" fill="none">
    <use href="#a"/><use href="#b"/>
  </g>
  <!-- dead gas in the burnt-out segment -->
  <use href="#b" stroke="color-mix(in oklch, var(--c2, #bb9af7) 45%, var(--bg, #1a1a1a))" stroke-width="3.6"/>
  <!-- lit cores -->
  <use href="#a" stroke="var(--c1, #7aa2f7)" stroke-width="3.8"/>
  <use href="#b2" stroke="var(--c1, #7aa2f7)" stroke-width="3.8" opacity="0.8"/>
  <use href="#a" stroke="var(--c3, #7dcfff)" stroke-width="1.8"/>
  <use href="#b2" stroke="var(--c3, #7dcfff)" stroke-width="1.8" opacity="0.6"/>
  <!-- mounting clips -->
  <g fill="color-mix(in oklch, var(--c1, #7aa2f7) 60%, var(--bg, #1a1a1a))">
    <rect x="-1.3" y="-4.8" width="2.6" height="9.6" rx="0.8" transform="translate(22.65 30.65) rotate(65.3)"/>
    <rect x="-1.3" y="-4.8" width="2.6" height="9.6" rx="0.8" transform="translate(45.6 21.4) rotate(114.7)"/>
  </g>
  <!-- hot electrode wire across the gap -->
  <path d="M41.4 30.6L39 36" stroke="var(--hot, #ff5fb0)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="42.2" cy="28.8" r="1.7" fill="var(--hot, #ff5fb0)"/>
  <circle cx="42.2" cy="28.8" r="3.6" fill="var(--hot, #ff5fb0)" opacity="0.3"/>
</svg>
