<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newbro Address Bar Suggestions</title>
  <style>
    /* `html body` / `html #root` outrank globals.css (imported later by the
       bundle). The padding is where the list's CSS shadow paints; main sizes
       the window to the list plus this margin (SHADOW_PADDING in
       src/main/omnibox-popup.ts). */
    html body {
      background: transparent;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      overflow: hidden;
      height: 100vh;
    }
    html #root {
      display: block;
      height: auto;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/omnibox.tsx"></script>
</body>
</html>
